<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>転送中...</title>
    <script>
        // アクセスされたパス（例: /oijiiw）や検索パラメータを取得してメインサイトへ転送
        const targetDomain = "https://www.fozowo.f5.si/ojwga";
        const currentPath = window.location.pathname;
        const currentSearch = window.location.search;
        const currentHash = window.location.hash;

        window.location.replace(targetDomain + currentPath + currentSearch + currentHash);
    </script>
</head>
<body>
    <p>自動的に転送されない場合は <a id="redirect-link" href="https://www.fozowo.f5.si/ojwga">こちら</a> をクリックしてください。</p>
    <script>
        document.getElementById("redirect-link").href = "https://www.fozowo.f5.si" + window.location.pathname;
    </script>
</body>
</html>
